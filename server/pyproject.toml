[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "asgiref==3.12.1",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.2",
    "colorama==0.4.6",
    "distro==1.9.0",
    "django==6.1.1",
    "django-environ==0.14.0",
    "djangorestframework==3.18.1",
    "djangorestframework-simplejwt==5.5.1",
    "groq==1.7.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.20",
    "iniconfig==2.3.0",
    "packaging==26.3",
    "pillow==12.3.0",
    "pluggy==1.6.0",
    "psycopg==3.3.6",
    "psycopg-binary==3.3.6",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "pygments==2.21.0",
    "pyjwt==2.15.1",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "rapidfuzz==3.14.6",
    "requests==2.34.2",
    "ruff==0.16.10",
    "sniffio==1.3.1",
    "sqlparse==0.6.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "tzdata==2026.5",
    "urllib3==2.8.0",
]

[project.scripts]
server = "server:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["E501"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["accounts/tests", "core/tests", "ingestion/tests"]
addopts = "--strict-markers --reuse-db"

